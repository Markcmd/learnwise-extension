<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnWise</title>
    <!-- defer means to load the script after the HTML is parsed -->
    <script src="../JSs/popup.js" defer></script>
    <link rel="stylesheet" href="../CSSs/popup.css" />
  </head>
  <body>
    <header class="lw-header">
      <img class="lw-logo" src="../icons/LEARNWISE_48.png" alt="" />
      <div>
        <div class="lw-title">LearnWise</div>
        <div class="lw-subtitle">Learn vocabulary as you read</div>
      </div>
    </header>

    <div class="card">
      <div class="row">
        <span class="row-label">Enable extension</span>
        <label class="switch" aria-label="Enable extension">
          <input id="enableToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="stat-line" id="statLine">
      <span class="stat-pair"><b id="statTotal">0</b> words</span>
      <span class="stat-dot">·</span>
      <span class="stat-pair"><b id="statKnown">0</b> known</span>
      <span class="stat-week" id="statWeek"></span>
    </div>

    <button id="openDashboard">Open LearnWise</button>
  </body>
</html>
